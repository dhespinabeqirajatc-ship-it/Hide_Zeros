apiVersion: batch/v1
kind: CronJob
metadata:
  name: workiva-zero-row-hider
spec:
  # Example: once per day at 00:00 UTC.
  # Change this cron expression to the time you want.
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: workiva-zero-row-hider
              image: image-registry.openshift-image-registry.svc:5000/YOUR_PROJECT/workiva-zero-row-hider:latest
              imagePullPolicy: Always
              envFrom:
                - secretRef:
                    name: workiva-zero-row-secrets
              env:
                - name: WORKIVA_CONTROL_CELL
                  value: "B2"
                - name: WORKIVA_API_VERSION
                  value: "2026-01-01"
                - name: WORKIVA_BASE_URL
                  value: "https://api.eu.wdesk.com"
