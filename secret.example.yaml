apiVersion: v1
kind: Secret
metadata:
  name: workiva-zero-row-secrets
  namespace: deppytest-dev
type: Opaque
stringData:
  WORKIVA_CLIENT_ID: "REPLACE_ME"
  WORKIVA_CLIENT_SECRET: "REPLACE_ME"

  # Comma-separated Workiva spreadsheet/document IDs.
  # Do not use JSON brackets.
  WORKIVA_DOCUMENT_IDS: "spreadsheet-id-1,spreadsheet-id-2,spreadsheet-id-3"

  WORKIVA_CONTROL_SPREADSHEET_ID: "REPLACE_ME"
  WORKIVA_CONTROL_SHEET_ID: "REPLACE_ME"
